[package]
name = "space_idle"
version = "0.1.0"
edition = "2024"
publish = ["nexus"]

[dependencies]
ryu = "1.0.23"
indicatif = "0.17"
rayon = "1.10"
cfb-mode = "0.8.2"
aes = "0.8.4"
md5 = "0.8.0"
base64 = "0.22.1"
flate2 = "1.1.9"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
reqwest = { version = "0.13.2", features = ["blocking"] }