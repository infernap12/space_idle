<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fleet Suggest</title>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #161a22;
    --panel-2: #1d222d;
    --border: #2a3040;
    --text: #e6e8ef;
    --muted: #8890a3;
    --accent: #4ea8ff;
    --accent-2: #2a5;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 960px; margin: 2rem auto; padding: 0 1rem;
    background: var(--bg); color: var(--text);
  }
  h1 { font-size: 1.25rem; margin: 0 0 1rem; }
  h2 { font-size: 0.95rem; margin: 0 0 0.5rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  label { display: block; margin-top: 0.5rem; font-size: 0.85rem; color: var(--muted); }
  input[type=number], input[type=text], select {
    width: 100%; padding: 0.5rem; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    font-family: inherit; font-size: 0.95rem;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 0.75rem; }
  .row > div { flex: 1; }
  button {
    padding: 0.55rem 1rem; background: var(--accent-2); color: #001;
    border: none; border-radius: 4px; font-weight: 600; cursor: pointer;
    font-size: 0.95rem;
  }
  button:disabled { background: #333; color: #777; cursor: wait; }
  button.ghost {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    padding: 0.4rem 0.7rem; font-weight: 500;
  }
  button.ghost:hover:not(:disabled) { background: var(--panel-2); border-color: var(--accent); }
  button.ghost:disabled { opacity: 0.4; cursor: not-allowed; }

  #go { margin-top: 1rem; }

  #result { margin-top: 1.5rem; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; }
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 0.75rem;
  }
  .nav .counter { font-variant-numeric: tabular-nums; color: var(--muted); }
  .nav .counter b { color: var(--text); }

  .best-badge {
    display: inline-block; padding: 0.15rem 0.5rem; font-size: 0.7rem;
    background: var(--accent-2); color: #001; border-radius: 10px;
    margin-left: 0.5rem; font-weight: 700; letter-spacing: 0.05em;
  }

  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem 1rem;
    font-size: 0.9rem; margin-bottom: 1rem;
  }
  .stats .k { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .stats .v { font-variant-numeric: tabular-nums; font-weight: 600; }

  .content { display: grid; grid-template-columns: auto 1fr; gap: 1.25rem; align-items: start; }
  @media (max-width: 640px) { .content { grid-template-columns: 1fr; } }

  .grid {
    display: grid;
    grid-template-columns: 1.5rem repeat(2, 60px);
    gap: 4px;
    background: var(--panel-2);
    padding: 0.5rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    user-select: none;
  }
  .grid .hdr {
    text-align: center; font-size: 0.75rem; color: var(--muted);
    display: flex; align-items: center; justify-content: center; height: 1.25rem;
  }
  .grid .rhdr {
    text-align: center; font-size: 0.75rem; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
  }
  .cell {
    width: 60px; height: 60px; background: #0a0c11; border: 1px solid var(--border);
    border-radius: 4px; position: relative; display: flex; align-items: center; justify-content: center;
  }
  .cell svg, .cell .ship-img { width: 80%; height: 80%; object-fit: contain; }
  .cell .ship-img { display: block; }
  .cell .badge {
    position: absolute; top: 2px; right: 3px; font-size: 0.65rem;
    background: rgba(0,0,0,0.6); color: var(--text); padding: 0 3px; border-radius: 3px;
    font-variant-numeric: tabular-nums;
  }

  .ships { display: flex; flex-direction: column; gap: 0.4rem; }
  .ship-row {
    display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0.6rem;
    background: var(--panel-2); border-radius: 4px; border: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .ship-row .icon { width: 28px; height: 28px; flex-shrink: 0; }
  .ship-row .icon svg, .ship-row .icon .ship-img { width: 100%; height: 100%; object-fit: contain; }
  .ship-row .name { font-weight: 600; }
  .ship-row .mods { color: var(--muted); font-size: 0.8rem; }
  .ship-row .mod-icons { display: inline-flex; gap: 3px; margin-right: 6px; vertical-align: middle; }
  .ship-row .mod-img {
    width: 18px; height: 18px; object-fit: contain;
    background: #0a0c11; border: 1px solid var(--border);
    border-radius: 3px; padding: 1px;
  }

  .status { color: var(--muted); font-size: 0.85rem; margin-top: 1rem; }
  .error { color: #ff6b6b; }

  .hazards { margin-top: 1rem; }
  .hazards h2 { margin-top: 0; }
  .hazard-item {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.35rem 0.6rem; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 4px;
    margin-top: 0.25rem; font-size: 0.85rem; cursor: pointer;
  }
  .hazard-item:hover { border-color: var(--accent); }
  .hazard-item .meta { color: var(--muted); font-size: 0.8rem; }
  .hazard-item .self-tag {
    color: var(--muted); font-size: 0.7rem;
    border: 1px solid var(--border); padding: 0 0.35rem;
    border-radius: 3px; margin-left: auto;
  }

  .inventory { margin-top: 1rem; }
  .inventory > label { color: var(--text); font-size: 0.9rem; }
  .inv-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 0.4rem; margin-top: 0.5rem;
  }
  .inv-item {
    display: grid;
    grid-template-columns: 24px 1fr 64px;
    align-items: center; gap: 0.5rem;
    padding: 0.3rem 0.5rem; margin: 0;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 4px; font-size: 0.85rem; color: var(--text);
  }
  .inv-item .icon { width: 24px; height: 24px; display: flex; }
  .inv-item .icon svg, .inv-item .icon .ship-img { width: 100%; height: 100%; object-fit: contain; }
  .inv-item input { padding: 0.25rem 0.4rem; font-size: 0.85rem; }

  .hidden { display: none; }
</style>
</head>
<body>
<h1>Fleet Suggest</h1>

<div class="row">
  <div><label>Node <input id="node" type="text" list="nodeList" placeholder="e.g. B1 or BB3" autocomplete="off"></label></div>
  <div><label>Stat level <input id="stat" type="number" step="0.05" placeholder="e.g. 12.5"></label></div>
</div>
<datalist id="nodeList"></datalist>
<div class="row">
  <div><label>Galaxy <input id="galaxy" type="number" value="4"></label></div>
  <div><label>Version <input id="version" type="number" value="75103"></label></div>
</div>
<div class="row">
  <div><label><input type="checkbox" id="boss"> Boss (for BB nodes)</label></div>
  <div><label>Ship skin
    <select id="skin">
      <option value="default" selected>Default</option>
      <option value="blue">Blue</option>
    </select>
  </label></div>
</div>

<div id="hazards" class="hazards hidden">
  <h2>Active hazards</h2>
  <div id="hazardList"></div>
</div>

<div id="inventory" class="inventory">
  <label><input type="checkbox" id="invFilter"> Only show fleets I can build</label>
  <div id="invInputs" class="inv-grid hidden"></div>
</div>

<button id="go">Suggest</button>

<div id="status" class="status">Enter a node and stat level, then Suggest.</div>

<div id="result" class="hidden">
  <div class="card">
    <div class="nav">
      <button class="ghost" id="prev" title="Previous (←)">← Prev</button>
      <div class="counter">Entry <b id="counter">1</b> / <b id="total">1</b><span id="bestBadge" class="best-badge hidden">BEST</span></div>
      <button class="ghost" id="next" title="Next (→)">Next →</button>
    </div>

    <div class="stats">
      <div><div class="k">Resources used</div><div class="v" id="sResUsed">–</div></div>
      <div><div class="k">Committed</div><div class="v" id="sResCommitted">–</div></div>
      <div><div class="k">Saved</div><div class="v" id="sSaved">–</div></div>
      <div><div class="k">Fleet stats</div><div class="v" id="sStats">–</div></div>
      <div><div class="k">Entry #</div><div class="v" id="sOrig">–</div></div>
      <div><div class="k">Event</div><div class="v" id="sEvent" style="font-size:0.8rem">–</div></div>
    </div>

    <div class="content">
      <div>
        <h2>Grid</h2>
        <div class="grid" id="shipGrid"></div>
      </div>
      <div>
        <h2>Ships</h2>
        <div class="ships" id="shipList"></div>
      </div>
    </div>
  </div>
</div>

<script>
const API_URL = "https://api.spaceidle.xyz/suggest_fleet_battle/";

const SHIP_TYPES = {
  Fighter:           { color: "#ffd23f", abbr: "Ft" },
  Corvette:          { color: "#4ecdc4", abbr: "Co" },
  Frigate:           { color: "#6bcB77", abbr: "Fr" },
  Cruiser:           { color: "#ff9f45", abbr: "Cr" },
  HeavyCruiser:      { color: "#ef476f", abbr: "HC" },
  Destroyer:         { color: "#b388ff", abbr: "Ds" },
  PlayerCommandShip: { color: "#ffffff", abbr: "CS" },
};

// Ship sprite base paths keyed by fleet_ships.id ("Fighter", "Corvette",
// …). Populated from the DB: ships.select_sprite via fleet_ships.ship.
// Mod icon paths keyed by fleet_mods.id.
let shipSpriteByType = null;
let modIconById = null;

// Insert the skin directory between the sprite path's directory and
// its filename: "assets/player/basic.png" + "blue" -> "assets/player/blue/basic.png".
// "default" uses the raw DB path.
function applySkinToPath(basePath, skin) {
  if (!basePath || !skin || skin === "default") return basePath;
  const slash = basePath.lastIndexOf("/");
  if (slash < 0) return `${skin}/${basePath}`;
  return basePath.slice(0, slash + 1) + skin + "/" + basePath.slice(slash + 1);
}

function shipSvgDataUrl(type) {
  return "data:image/svg+xml;utf8," + encodeURIComponent(shipSvg(type));
}

// Render an <img> sprite with an inline SVG silhouette as onerror
// fallback, so missing asset files degrade gracefully.
function shipVisual(type) {
  const skin = state && state.skin ? state.skin : "default";
  const base = shipSpriteByType ? shipSpriteByType.get(type) : null;
  if (!base) return shipSvg(type);
  const path = applySkinToPath(base, skin);
  const fb = shipSvgDataUrl(type);
  return `<img class="ship-img" alt="${type}" src="${path}" onerror="this.onerror=null;this.src='${fb}'">`;
}

function modVisual(modId) {
  const path = modIconById ? modIconById.get(modId) : null;
  if (!path) return "";
  const label = escapeHtml(modId);
  return `<img class="mod-img" alt="${label}" title="${label}" src="${escapeHtml(path)}" onerror="this.style.display='none'">`;
}

// Simple distinct silhouettes per ship type. viewBox 0 0 100 100.
function shipSvg(type) {
  const meta = SHIP_TYPES[type] || { color: "#888", abbr: "?" };
  const c = meta.color;
  const paths = {
    Fighter:
      `<polygon points="50,15 65,70 50,60 35,70" fill="${c}" stroke="#000" stroke-width="2"/>`,
    Corvette:
      `<polygon points="50,10 70,55 60,75 40,75 30,55" fill="${c}" stroke="#000" stroke-width="2"/>`,
    Frigate:
      `<polygon points="50,8 72,50 62,80 38,80 28,50" fill="${c}" stroke="#000" stroke-width="2"/>
       <rect x="42" y="55" width="16" height="25" fill="#000" opacity="0.3"/>`,
    Cruiser:
      `<polygon points="50,8 78,35 78,70 50,88 22,70 22,35" fill="${c}" stroke="#000" stroke-width="2"/>
       <circle cx="50" cy="50" r="10" fill="#000" opacity="0.35"/>`,
    HeavyCruiser:
      `<polygon points="50,6 82,30 85,72 50,92 15,72 18,30" fill="${c}" stroke="#000" stroke-width="2"/>
       <rect x="35" y="35" width="30" height="30" fill="#000" opacity="0.35"/>
       <rect x="42" y="20" width="16" height="10" fill="${c}" stroke="#000" stroke-width="1.5"/>`,
    Destroyer:
      `<polygon points="50,8 85,45 75,85 50,75 25,85 15,45" fill="${c}" stroke="#000" stroke-width="2"/>
       <polygon points="50,30 62,55 50,60 38,55" fill="#000" opacity="0.4"/>`,
    PlayerCommandShip:
      `<polygon points="50,5 60,38 92,38 66,58 76,92 50,72 24,92 34,58 8,38 40,38"
         fill="${c}" stroke="#000" stroke-width="2"/>`,
  };
  const body = paths[type] || `<rect x="20" y="20" width="60" height="60" fill="${c}" stroke="#000" stroke-width="2"/>`;
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="${type}">${body}</svg>`;
}

function parseFleetString(raw) {
  let s = raw.trim();
  if (s.startsWith("V2")) s = s.slice(2);
  const parts = s.split("|");
  if (parts.length < 2) return null;

  const header = parts[0].split(",");
  const resources_used = parseFloat(header[0]);
  const resources_committed = parseFloat(header[1]);
  const fleet_stats = header[2] !== undefined ? parseFloat(header[2]) : null;
  if (isNaN(resources_used) || isNaN(resources_committed)) return null;

  const ships = [];
  for (const part of parts.slice(2)) {
    if (!part) continue;
    if (!part.includes(";")) break;
    const sp = part.split(";");
    if (!sp.length || sp[0] === "Null") continue;

    const ship_type = sp[0];
    const mods = sp[1] ? sp[1].split(",").filter(Boolean) : [];
    const positions = sp[2]
      ? sp[2].split("*").map(p => {
          const [c, r] = p.split(",");
          return [parseInt(c, 10), parseInt(r, 10)];
        }).filter(([c, r]) => !isNaN(c) && !isNaN(r))
      : [];
    const count = sp[3] !== undefined ? (parseInt(sp[3], 10) || positions.length) : positions.length;
    ships.push({ ship_type, mods, positions, count });
  }

  return { resources_used, resources_committed, fleet_stats: isNaN(fleet_stats) ? null : fleet_stats, ships };
}

function bucketFor(id) {
  // "g5a_b4" -> "5", "g2_4_b4a" -> "2", "g10_b1" -> "10".
  const m = id.match(/^g(\d+)/);
  return m ? m[1] : "";
}

function findFleetEventId(rows, galaxy, nodeName) {
  // Galaxy prefixes vary: g4_, g5_, g5a_, g5b_, g2_4_, etc.
  // Match gN followed by anything non-digit so g5 doesn't catch g50.
  const re = new RegExp(`^g${galaxy}(?![0-9])`);
  const up = nodeName.toUpperCase();
  for (const { id, name } of rows) {
    if (re.test(id) && name === up) return id;
  }
  return null;
}

let rowsCache = null;
let rowsByGalaxyCache = null;
let hazardsByTargetCache = null;

function buildIndexes(rows) {
  rowsByGalaxyCache = new Map();
  for (const r of rows) {
    const g = bucketFor(r.id);
    if (!g) continue;
    if (!rowsByGalaxyCache.has(g)) rowsByGalaxyCache.set(g, []);
    rowsByGalaxyCache.get(g).push(r);
  }

  hazardsByTargetCache = new Map();
  for (const r of rows) {
    if (!r.hazard || !Array.isArray(r.hazard)) continue;
    for (const entry of r.hazard) {
      if (!entry || !Array.isArray(entry.nodes_effected)) continue;
      for (const tgt of entry.nodes_effected) {
        const targetId = tgt && tgt.fleet_event;
        if (!targetId) continue;
        if (!hazardsByTargetCache.has(targetId)) hazardsByTargetCache.set(targetId, []);
        hazardsByTargetCache.get(targetId).push({
          source_id: r.id,
          source_name: r.name,
          type: entry.type || "?",
          repeat: !!entry.repeat,
          isSelf: r.id === targetId,
        });
      }
    }
  }
}

const SQLJS_CDN = "https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/";
async function loadDb() {
  if (rowsCache) return rowsCache;
  if (typeof initSqlJs !== "function") {
    throw new Error("sql.js failed to load (check network / CDN)");
  }
  const [SQL, res] = await Promise.all([
    initSqlJs({ locateFile: f => SQLJS_CDN + f }),
    fetch("./game_data.sqlite"),
  ]);
  if (!res.ok) throw new Error(`Failed to load game_data.sqlite: ${res.status}`);
  const buf = await res.arrayBuffer();
  const db = new SQL.Database(new Uint8Array(buf));

  // fleet_events (id, name) + fleet_events__hazard (one row per hazard entry).
  const [events] = db.exec("SELECT id, name FROM fleet_events ORDER BY id");
  const hazardRes = db.exec(
    "SELECT _parent, type, repeat, nodes_effected FROM fleet_events__hazard ORDER BY _parent, _index"
  );
  // Ship sprites: fleet_ships.id (player-facing type) -> ships.select_sprite.
  const shipRes = db.exec(
    "SELECT fs.id, s.select_sprite FROM fleet_ships fs " +
    "JOIN ships s ON s.id = fs.ship WHERE fs.is_player_ship = 1"
  );
  // Fleet mod icons: fleet_mods.id -> icon path.
  const modRes = db.exec("SELECT id, icon FROM fleet_mods");
  db.close();

  shipSpriteByType = new Map();
  if (shipRes.length) {
    for (const [id, sprite] of shipRes[0].values) {
      if (sprite) shipSpriteByType.set(id, sprite);
    }
  }
  modIconById = new Map();
  if (modRes.length) {
    for (const [id, icon] of modRes[0].values) {
      if (icon) modIconById.set(id, icon);
    }
  }

  const hazardsByParent = new Map();
  if (hazardRes.length) {
    for (const [parent, type, repeat, nodesJson] of hazardRes[0].values) {
      let nodes = [];
      try { nodes = JSON.parse(nodesJson || "[]"); } catch (_) { nodes = []; }
      if (!hazardsByParent.has(parent)) hazardsByParent.set(parent, []);
      hazardsByParent.get(parent).push({
        type, repeat: !!repeat, nodes_effected: nodes,
      });
    }
  }

  const rows = [];
  for (const [id, name] of events.values) {
    rows.push({ id, name, hazard: hazardsByParent.get(id) || null });
  }

  rowsCache = rows;
  buildIndexes(rows);
  return rows;
}

const state = {
  allEntries: [], // Full parsed server response, never mutated by filter.
  entries: [],    // Filtered view currently displayed.
  index: 0,
  eventId: "",
  skin: "default",
};

const els = {
  node: document.getElementById("node"),
  nodeList: document.getElementById("nodeList"),
  stat: document.getElementById("stat"),
  galaxy: document.getElementById("galaxy"),
  version: document.getElementById("version"),
  boss: document.getElementById("boss"),
  go: document.getElementById("go"),
  status: document.getElementById("status"),
  result: document.getElementById("result"),
  prev: document.getElementById("prev"),
  next: document.getElementById("next"),
  counter: document.getElementById("counter"),
  total: document.getElementById("total"),
  bestBadge: document.getElementById("bestBadge"),
  sResUsed: document.getElementById("sResUsed"),
  sResCommitted: document.getElementById("sResCommitted"),
  sSaved: document.getElementById("sSaved"),
  sStats: document.getElementById("sStats"),
  sOrig: document.getElementById("sOrig"),
  sEvent: document.getElementById("sEvent"),
  shipGrid: document.getElementById("shipGrid"),
  shipList: document.getElementById("shipList"),
  hazards: document.getElementById("hazards"),
  hazardList: document.getElementById("hazardList"),
  invFilter: document.getElementById("invFilter"),
  invInputs: document.getElementById("invInputs"),
  skin: document.getElementById("skin"),
};

function renderInventoryInputs() {
  const prev = {};
  els.invInputs.querySelectorAll("input[data-ship]").forEach(el => {
    prev[el.dataset.ship] = el.value;
  });
  els.invInputs.innerHTML = Object.keys(SHIP_TYPES).map(t => `
    <label class="inv-item" title="${t}">
      <span class="icon">${shipVisual(t)}</span>
      <span>${t}</span>
      <input type="number" min="0" step="1" value="${prev[t] ?? 0}" data-ship="${t}">
    </label>`).join("");
}
renderInventoryInputs();

function readInventory() {
  const inv = {};
  els.invInputs.querySelectorAll("input[data-ship]").forEach(el => {
    inv[el.dataset.ship] = parseInt(el.value, 10) || 0;
  });
  return inv;
}

function fleetFits(entry, inv) {
  return entry.ships.every(s => {
    const required = Math.min(s.count, s.positions.length);
    return (inv[s.ship_type] || 0) >= required;
  });
}

function applyFilter() {
  if (!state.allEntries.length) return;
  const on = els.invFilter.checked;
  if (on) {
    const inv = readInventory();
    state.entries = state.allEntries.filter(({ entry }) => fleetFits(entry, inv));
  } else {
    state.entries = state.allEntries.slice();
  }
  state.index = 0;
  const n = state.entries.length;
  const total = state.allEntries.length;
  els.status.classList.remove("error");
  if (!n) {
    els.result.classList.add("hidden");
    els.status.textContent = `0 of ${total} suggestion${total === 1 ? "" : "s"} match your ship inventory.`;
    return;
  }
  const suffix = (on && n !== total) ? ` (of ${total})` : "";
  els.status.textContent = `${n} suggestion${n === 1 ? "" : "s"}${suffix} for ${state.eventId}.`;
  els.result.classList.remove("hidden");
  showCurrent();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function refreshNodeList() {
  if (!rowsByGalaxyCache) return;
  const g = els.galaxy.value.trim();
  const rows = rowsByGalaxyCache.get(g) || [];
  const seen = new Set();
  const opts = [];
  for (const r of rows) {
    if (!r.name || seen.has(r.name)) continue;
    seen.add(r.name);
    opts.push(`<option value="${escapeHtml(r.name)}">`);
  }
  els.nodeList.innerHTML = opts.join("");
}

function refreshHazards() {
  if (!rowsCache || !hazardsByTargetCache) {
    els.hazards.classList.add("hidden");
    return;
  }
  const node = els.node.value.trim();
  const galaxy = parseInt(els.galaxy.value, 10);
  if (!node || isNaN(galaxy)) {
    els.hazards.classList.add("hidden");
    els.hazardList.innerHTML = "";
    return;
  }
  const id = findFleetEventId(rowsCache, galaxy, node);
  const hazards = id ? (hazardsByTargetCache.get(id) || []) : [];
  if (!hazards.length) {
    els.hazards.classList.add("hidden");
    els.hazardList.innerHTML = "";
    return;
  }
  const items = hazards.map(h => {
    const repeatTag = h.repeat ? " · repeat" : "";
    const selfTag = h.isSelf ? `<span class="self-tag">self</span>` : "";
    return `<label class="hazard-item">
      <input type="checkbox" data-source-id="${escapeHtml(h.source_id)}">
      <span><b>${escapeHtml(h.source_name)}</b> <span class="meta">${escapeHtml(h.source_id)} · ${escapeHtml(h.type)}${repeatTag}</span></span>
      ${selfTag}
    </label>`;
  });
  els.hazardList.innerHTML = items.join("");
  els.hazards.classList.remove("hidden");
}

function fmt(n, d = 2) {
  if (n === null || n === undefined || isNaN(n)) return "–";
  return Number(n).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
}

function renderGrid(ships) {
  // 2 columns (B=1, A=0) × 5 rows.
  const occ = new Map();
  const countAt = new Map();
  for (const ship of ships) {
    for (const [c, r] of ship.positions) {
      const key = `${c},${r}`;
      occ.set(key, ship.ship_type);
      countAt.set(key, (countAt.get(key) || 0) + 1);
    }
  }

  const parts = [];
  parts.push(`<div class="rhdr"></div><div class="hdr">B</div><div class="hdr">A</div>`);
  for (let row = 0; row < 5; row++) {
    parts.push(`<div class="rhdr">${row + 1}</div>`);
    for (const col of [1, 0]) {
      const key = `${col},${row}`;
      const type = occ.get(key);
      if (type) {
        const badgeCount = countAt.get(key);
        const badge = badgeCount > 1 ? `<span class="badge">×${badgeCount}</span>` : "";
        parts.push(`<div class="cell" title="${type} @ (${col},${row})">${shipVisual(type)}${badge}</div>`);
      } else {
        parts.push(`<div class="cell"></div>`);
      }
    }
  }
  return parts.join("");
}

function renderShipList(ships) {
  if (!ships.length) return `<div class="ship-row"><span class="mods">No ships</span></div>`;
  return ships.map(s => {
    const modIcons = s.mods.map(m => modVisual(m)).filter(Boolean).join("");
    const modText = s.mods.length ? s.mods.join(", ") : "no mods";
    const positions = s.positions.map(([c, r]) => `(${c},${r + 1})`).join(" ");
    return `
      <div class="ship-row">
        <div class="icon">${shipVisual(s.ship_type)}</div>
        <div style="flex:1; min-width: 0;">
          <div><span class="name">${s.ship_type}</span> × ${s.count}</div>
          <div class="mods">
            ${modIcons ? `<span class="mod-icons">${modIcons}</span>` : ""}
            <span class="mod-text">${modText} · ${positions || "no positions"}</span>
          </div>
        </div>
      </div>`;
  }).join("");
}

function showCurrent() {
  const n = state.entries.length;
  if (!n) return;
  if (state.index < 0) state.index = 0;
  if (state.index >= n) state.index = n - 1;

  const { origIdx, entry } = state.entries[state.index];
  els.counter.textContent = state.index + 1;
  els.total.textContent = n;
  els.bestBadge.classList.toggle("hidden", state.index !== 0);
  els.prev.disabled = state.index === 0;
  els.next.disabled = state.index === n - 1;

  els.sResUsed.textContent = fmt(entry.resources_used);
  els.sResCommitted.textContent = fmt(entry.resources_committed);
  els.sSaved.textContent = fmt(entry.resources_committed - entry.resources_used);
  els.sStats.textContent = entry.fleet_stats !== null ? fmt(entry.fleet_stats) : "–";
  els.sOrig.textContent = `#${origIdx}`;
  els.sEvent.textContent = state.eventId;

  els.shipGrid.innerHTML = renderGrid(entry.ships);
  els.shipList.innerHTML = renderShipList(entry.ships);
}

async function run() {
  els.status.classList.remove("error");
  els.status.textContent = "Working…";
  els.result.classList.add("hidden");
  els.go.disabled = true;
  try {
    const node = els.node.value.trim();
    const stat = parseFloat(els.stat.value);
    const galaxy = parseInt(els.galaxy.value, 10);
    const version = parseInt(els.version.value, 10);
    const has_boss = els.boss.checked;

    if (!node) throw new Error("Node name required");
    if (isNaN(stat)) throw new Error("Invalid stat level");

    const rows = await loadDb();
    const fleet_event_id = findFleetEventId(rows, galaxy, node);
    if (!fleet_event_id) throw new Error(`Could not find node '${node}' in galaxy ${galaxy}`);

    const hazard_node_list = Array.from(
      els.hazardList.querySelectorAll("input:checked"),
    ).map(el => el.dataset.sourceId).join("");

    const body = { fleet_event_id, version, combat_stat_level: stat, hazard_node_list, has_boss };
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    const lines = await res.json();

    const parsed = [];
    lines.forEach((line, i) => {
      const trimmed = (line || "").trim();
      if (!trimmed) return;
      const e = parseFleetString(trimmed);
      if (e) parsed.push({ origIdx: i + 1, entry: e });
    });
    // Best first: lowest resources_used.
    parsed.sort((a, b) => a.entry.resources_used - b.entry.resources_used);

    if (!parsed.length) throw new Error("Server returned no fleet entries");

    state.allEntries = parsed;
    state.eventId = fleet_event_id;
    applyFilter();
  } catch (e) {
    els.status.classList.add("error");
    els.status.textContent = `Error: ${e.message || e}`;
  } finally {
    els.go.disabled = false;
  }
}

els.go.addEventListener("click", run);
els.prev.addEventListener("click", () => { state.index--; showCurrent(); });
els.next.addEventListener("click", () => { state.index++; showCurrent(); });

els.galaxy.addEventListener("input", () => { refreshNodeList(); refreshHazards(); });
els.node.addEventListener("input", refreshHazards);
els.node.addEventListener("change", refreshHazards);

els.invFilter.addEventListener("change", () => {
  els.invInputs.classList.toggle("hidden", !els.invFilter.checked);
  applyFilter();
});
els.invInputs.addEventListener("input", applyFilter);

els.skin.addEventListener("change", () => {
  state.skin = els.skin.value;
  renderInventoryInputs();
  if (state.entries.length) showCurrent();
});

document.addEventListener("keydown", e => {
  const typing = document.activeElement && ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
  if (e.key === "Enter" && !els.go.disabled && typing) { run(); return; }
  if (state.entries.length) {
    if (e.key === "ArrowLeft" && !els.prev.disabled) { state.index--; showCurrent(); }
    else if (e.key === "ArrowRight" && !els.next.disabled) { state.index++; showCurrent(); }
  }
});

// Eagerly load CSV so autocomplete and hazard toggles are ready.
// Eagerly load the sqlite DB so autocomplete and hazard toggles are
// ready before the user hits Suggest.
loadDb().then(() => { refreshNodeList(); refreshHazards(); }).catch(e => {
  els.status.classList.add("error");
  els.status.textContent = `Error loading database: ${e.message || e}`;
});
</script>
</body>
</html>
